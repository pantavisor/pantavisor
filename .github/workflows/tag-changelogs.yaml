name: "ontag: generate changelog and release notes"

# Fires when a release tag lands in this repo. Tags are pushed here by
# meta-pantavisor's tag-sync workflow (sync-pantavisor-tag.sh), which creates
# the ref via the GitHub API using a PAT (PANTAVISOR_TAG_SYNC_TOKEN) — refs
# created with a PAT DO trigger workflows, so this push event fires normally.
#
# By the time it runs the tag already exists, so make-changelog.sh runs in
# historical mode. The rendered section is then:
#   1. Merged into the per-major S3 accumulator
#      (s3://$AWS_S3_BUCKET/changelog/pantavisor/CHANGELOG-<MAJOR>.md), the
#      rolling cross-RC changelog document. Nothing is committed to master.
#   2. Published as the body of the GitHub Release for the tag.
#
# The repo's CHANGELOG/CHANGELOG-<MAJOR>.md is written only by
# `make-changelog.sh --finalize` just before a stable tag; the changelog-gate
# job (changelog-gate.yaml) fails a stable release whose tagged commit is
# missing or does not match that finalize commit — so a bad stable tag
# publishes neither the S3 accumulator nor the GitHub Release.
#
# Unlike meta-pantavisor's changelog (Downloads + multi-component SRCREV diff),
# this one only renders categorized changes plus a version line, since
# pantavisor is a single source repo.
#
# Manual re-run via workflow_dispatch is supported (e.g. to backfill or after a
# tag re-push).

on:
  push:
    tags:
      - '0*'
      - '*-rc*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to generate changelog for (e.g. 028-rc8)"
        required: true

jobs:
  changelog-gate:
    uses: ./.github/workflows/changelog-gate.yaml
    secrets: inherit
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  changelog:
    needs: changelog-gate
    name: "changelog (${{ github.event.inputs.tag || github.ref_name }})"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag and derive major
        run: |
          if [[ ! "$TAG" =~ ^0[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match release pattern (0NN or 0NN-rcN)."
            exit 1
          fi
          MAJOR="${TAG%%-*}"
          echo "MAJOR=$MAJOR" >> "$GITHUB_ENV"
          echo "Tag:   $TAG"
          echo "Major: $MAJOR"

      - name: Checkout master with full history
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Seed base file from the S3 accumulator
        run: |
          # make-changelog.sh merges the tag's section into whatever
          # CHANGELOG/CHANGELOG-<MAJOR>.md already contains. Start from the
          # rolling S3 document so earlier RC sections (never committed to
          # master) are carried forward. A 404 means this is the first tag in
          # the major — the generator then creates the file from scratch.
          mkdir -p CHANGELOG
          URL="https://pantavisor-ci.s3.amazonaws.com/pantavisor/changelog/pantavisor/CHANGELOG-${MAJOR}.md"
          curl -sfL -o "CHANGELOG/CHANGELOG-${MAJOR}.md" "$URL" \
            && echo "seeded from $URL" \
            || echo "no S3 accumulator yet for ${MAJOR} — starting fresh"

      - name: Generate changelog file (historical mode)
        run: |
          # The tag exists by the time this fires, so make-changelog.sh runs in
          # historical mode: writes CHANGELOG/CHANGELOG-<MAJOR>.md and does not
          # commit. --no-commit is belt-and-braces (historical mode never
          # commits anyway).
          ./.github/scripts/make-changelog.sh --no-commit "$TAG"

      - name: Publish the S3 accumulator
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 cp "CHANGELOG/CHANGELOG-${MAJOR}.md" \
            "s3://${AWS_S3_BUCKET}/changelog/pantavisor/CHANGELOG-${MAJOR}.md"

      - name: Render release-notes section to a file
        run: |
          ./.github/scripts/make-changelog.sh --stdout "$TAG" > /tmp/release-notes.md
          echo "----- release-notes.md (head) -----"
          head -20 /tmp/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating notes."
            # --draft=false re-publishes a release that GitHub flipped back
            # to draft after a tag re-push
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --notes-file /tmp/release-notes.md
          else
            echo "Release $TAG does not exist — creating with notes."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          fi
