# Build the appengine distro from this pantavisor revision and run the pvtest
# suite against it.
#
# Jobs are picked per changed file, and the run is their union:
#   pvtest/suites/local/                      local  (volatile + persistent)
#   pvtest/suites/remote/                     remote (volatile + persistent)
#   pvtest/{tester,shared,host}/              local + remote (volatile + persistent)
#   pantahub/, ph_logger, trestclient,
#   updater, event/event_rest                 remote (volatile)
#   anything else but docs/                   local  (volatile)
# Persistent shares one device across tests, so it runs when tests or the
# framework change: it catches a test leaking state into the next one, which
# volatile never sees. The nightly in meta-pantavisor covers both models
# regardless. See docs/testing/pvtest-harness.md "CI coverage".
# Remote tests register real devices on a Hub, so they need the PH_USER/PH_TOKEN
# (Pantahub personal token) repository secrets; the run fails fast with a clear
# message if they are unset..
#
# It builds against meta-pantavisor master. The workflow_dispatch meta_ref input
# overrides that, for a change that spans both repos and needs the other side's
# branch to be green.

name: "onpush: pvtest"

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "**"
      - "!docs/**"

  workflow_dispatch:
    inputs:
      meta_ref:
        description: 'meta-pantavisor ref to build against (default: master)'
        required: false
        type: string
      test_scope:
        description: 'Scope to run (auto = from changed paths)'
        required: false
        type: choice
        default: auto
        options: [auto, local, remote, all]
      test_model:
        description: 'Assignment model for every selected scope (auto = from changed paths)'
        required: false
        type: choice
        default: auto
        options: [auto, volatile, persistent, all]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-draft:
    runs-on: ubuntu-latest
    outputs:
      is_draft: ${{ steps.check.outputs.is_draft }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh pr list --repo ${{ github.repository }} --head ${{ github.head_ref || github.ref_name }} --json isDraft --jq '.[0].isDraft // false')
          echo "is_draft=$draft" >> $GITHUB_OUTPUT

  scope:
    needs: check-draft
    if: needs.check-draft.outputs.is_draft != 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_INPUT: ${{ inputs.test_scope }}
          MODEL_INPUT: ${{ inputs.test_model }}
          PH_USER: ${{ secrets.PH_USER }}
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
          PH_PASS: ${{ secrets.PH_PASS }} # deprecated, PH_TOKEN fallback
        run: |
          set -euo pipefail

          # lv/lp = local volatile/persistent, rv/rp = remote volatile/persistent
          lv= lp= rv= rp=

          case "${SCOPE_INPUT:-auto}" in
            local)  lv=1 ;;
            remote) rv=1 ;;
            all)    lv=1 rv=1 ;;
            *)
              pr='${{ github.event.pull_request.number }}'
              if [ -n "$pr" ]; then
                files=$(gh api --paginate \
                  "repos/${{ github.repository }}/pulls/$pr/files" --jq '.[].filename')
              else
                base='${{ github.event.before }}'
                case "$base" in
                  ''|0000000000000000000000000000000000000000)
                    # new branch, or a force-push whose base is gone: no diff to
                    # trust, so run everything rather than silently skip any of it
                    files=everything ;;
                  *)
                    files=$(gh api "repos/${{ github.repository }}/compare/$base...${{ github.sha }}" \
                      --jq '.files[].filename')
                    if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ]; then
                      files=everything
                    fi ;;
                esac
              fi

              if [ "$files" = everything ]; then
                lv=1 lp=1 rv=1 rp=1
              else
                while IFS= read -r f; do
                  case "$f" in
                    ''|docs/*) ;;
                    pvtest/suites/local/*) lv=1 lp=1 ;;
                    pvtest/suites/remote/*) rv=1 rp=1 ;;
                    pvtest/*) lv=1 lp=1 rv=1 rp=1 ;;
                    pantahub/*|ph_logger.[ch]|trestclient.[ch]|updater.[ch]|event/event_rest.[ch]) rv=1 ;;
                    *) lv=1 ;;
                  esac
                done <<< "$files"
              fi ;;
          esac

          # never hand the pvtest job an empty matrix
          if [ -z "$lv$lp$rv$rp" ]; then
            lv=1
          fi

          # an explicit model replaces the models of every selected scope
          if [ "${MODEL_INPUT:-auto}" != auto ]; then
            v= p=
            case "$MODEL_INPUT" in
              volatile)   v=1 ;;
              persistent) p=1 ;;
              all)        v=1 p=1 ;;
            esac
            if [ -n "$lv$lp" ]; then lv=$v lp=$p; fi
            if [ -n "$rv$rp" ]; then rv=$v rp=$p; fi
          fi

          if [ -n "$rv$rp" ]; then
            if [ -z "${PH_USER:-}" ] || { [ -z "${PH_TOKEN:-}" ] && [ -z "${PH_PASS:-}" ]; }; then
              echo "::error::scope includes the remote suite, which registers devices on a Hub, but the PH_USER and PH_TOKEN repository secrets are not set on ${{ github.repository }}"
              exit 1
            fi
          fi

          matrix=$(printf '%s\n' ${lv:+local/volatile} ${lp:+local/persistent} \
            ${rv:+remote/volatile} ${rp:+remote/persistent} \
            | jq -Rnc '[inputs | split("/") | {scope: .[0], model: .[1]}]')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "### pvtest matrix: \`$matrix\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [check-draft, scope]
    if: needs.check-draft.outputs.is_draft != 'true'
    name: "build (docker-x86_64-scarthgap)"
    env:
      TMPDIR: "tmp-scarthgap"
      configs: kas/build-configs/release/docker-x86_64-scarthgap.yaml:kas/build-configs/shared-vols.yaml
      PV_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ["self-hosted"]
    container:
      image: ghcr.io/pantacor/kas/kas:next-v7
      volumes:
        - shared:/shared
      options: --user root
    steps:
      - name: checkout meta-pantavisor
        uses: actions/checkout@v6
        with:
          repository: pantavisor/meta-pantavisor
          ref: ${{ inputs.meta_ref || 'master' }}
          # a persisted GITHUB_TOKEN header would shadow the private-repo .netrc
          persist-credentials: false

      - name: setup workspace
        run: |
          git config --global --add safe.directory '*'
          chown -R builder:builder $RUNNER_WORKSPACE
          chown -R builder:builder /__w
          mkdir -p /shared/sstate && chown builder:builder /shared/sstate
          mkdir -p /shared/dldir && chown builder:builder /shared/dldir

      # Private source repositories (pv-mqtt-sdk) are fetched over HTTPS with
      # a read-only token; kas copies NETRC_FILE into the build's HOME.
      - name: git credentials
        env:
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: |
          umask 077
          : > ~builder/.netrc
          if [ -n "$PRIVATE_REPOS_TOKEN" ]; then
            printf 'machine github.com login x-access-token password %s\n' "$PRIVATE_REPOS_TOKEN" > ~builder/.netrc
          fi
          chown builder:builder ~builder/.netrc

      - name: build appengine distro against this pantavisor revision
        run: |
          su - builder -c "cd $GITHUB_WORKSPACE && NETRC_FILE=\$HOME/.netrc kas shell ${{ env.configs }} -c '
            devtool modify pantavisor &&
            cd workspace/sources/pantavisor &&
            git fetch origin ${{ env.PV_SHA }} &&
            git checkout ${{ env.PV_SHA }} &&
            cd ../../../ &&
            bitbake -c build pantavisor-appengine-distro'"

      - name: stage distro for the test job
        run: |
          chmod -R 777 $GITHUB_WORKSPACE
          BUILD_BASE_DIR=$(echo build/${{ env.TMPDIR }}/deploy/images/*)
          UNPACKED_DIR=$(find "${BUILD_BASE_DIR}" -maxdepth 1 -type d -name "pantavisor-appengine-distro-*" | head -1)
          if [ ! -d "$UNPACKED_DIR" ]; then
            echo "no unpacked appengine distro under ${BUILD_BASE_DIR}" >&2
            exit 1
          fi
          mkdir -p pvtest-distro
          cp -r "${UNPACKED_DIR}/." ./pvtest-distro/

      - name: Archive pvtest distro
        uses: actions/upload-artifact@v7
        with:
          name: pvtest-distro-docker-x86_64-scarthgap
          path: pvtest-distro/

      - name: remove git credentials
        if: always()
        run: rm -f ~builder/.netrc

  pvtest:
    needs: [build, scope]
    name: "pvtest (${{ matrix.scope }}, ${{ matrix.model }})"
    runs-on: ["pvtest-runner"]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      WORKSPACE: /tmp/workspace-${{ github.run_id }}-${{ matrix.scope }}-${{ matrix.model }}
      PVTEST_WORKSPACE: /tmp/pvtest-workspace-${{ github.run_id }}-${{ matrix.scope }}-${{ matrix.model }}
      # runners share one docker daemon: a per-job tag keeps neighbouring jobs off this job's images
      PVTEST_IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scope }}-${{ matrix.model }}
    steps:
      - name: Download pvtest distro
        uses: actions/download-artifact@v7
        with:
          name: pvtest-distro-docker-x86_64-scarthgap
          path: ${{ env.WORKSPACE }}

      - name: Load Docker images
        working-directory: ${{ env.WORKSPACE }}
        run: |
          chmod +x test.docker.sh
          CI_MODE=true ./test.docker.sh install-docker

      - name: Run pvtests
        working-directory: ${{ env.WORKSPACE }}
        env:
          PH_USER: ${{ secrets.PH_USER }}
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
          PH_PASS: ${{ secrets.PH_PASS }} # deprecated, PH_TOKEN fallback
          SCOPE: ${{ matrix.scope }}
          MODEL: ${{ matrix.model }}
        run: |
          echo "=== AppEngine Test Run started at $(date) ==="
          ./test.docker.sh run "$SCOPE" -V -p 6 --model "$MODEL" --fail-on-skip -w $PVTEST_WORKSPACE

      - name: Show Tests Summary
        working-directory: ${{ env.WORKSPACE }}
        if: always()
        run: |
          echo "## ${{ matrix.scope }} (${{ matrix.model }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f run.log ] && grep -q 'SUMMARY' run.log; then
            {
              echo '```'
              sed -n '/SUMMARY/,$p' run.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f run.log ]; then
            echo "Tests Run Failed (no summary in run log)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "Tests Run Failed (no log found)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Show test.log issues
        if: always()
        run: |
          found=0
          while IFS= read -r -d '' logfile; do
            test_name="${logfile#${{ env.PVTEST_WORKSPACE }}/}"
            test_name="${test_name%/test.log}"
            issues=$(grep -E "^\[pvtest\] [0-9]+ (WARN|ERROR) --" "$logfile" 2>/dev/null || true)
            if [ -n "$issues" ]; then
              if [ "$found" -eq 0 ]; then
                echo "## Test log issues" >> "$GITHUB_STEP_SUMMARY"
                found=1
              fi
              printf '\n### %s\n```\n%s\n```\n' "$test_name" "$issues" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(find "${{ env.PVTEST_WORKSPACE }}" -name "test.log" -print0 2>/dev/null)

      - name: Prepare pvtest workspace
        if: always()
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "PVTEST_ARTIFACT_NAME=pvtest-workspace-${sha:0:7}-${{ matrix.scope }}-${{ matrix.model }}" >> $GITHUB_ENV
          sudo chown -R $(id -u):$(id -g) $PVTEST_WORKSPACE || true

      - name: Upload pvtest workspace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PVTEST_ARTIFACT_NAME }}
          path: |
            ${{ env.PVTEST_WORKSPACE }}/README.md
            ${{ env.PVTEST_WORKSPACE }}/run.log
            ${{ env.PVTEST_WORKSPACE }}/results
            ${{ env.PVTEST_WORKSPACE }}/valgrind
            ${{ env.PVTEST_WORKSPACE }}/*.log
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          # scoped to this job's PVTEST_IMAGE_TAG; a global sweep would untag images a neighbouring job still needs
          if [ -x "$WORKSPACE/test.docker.sh" ]; then
            (cd "$WORKSPACE" && ./test.docker.sh clean-docker)
          fi

          rm -rf $WORKSPACE
          sudo rm -rf $PVTEST_WORKSPACE
